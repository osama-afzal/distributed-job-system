services:
  postgres:
    image: postgres:16
    container_name: djs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distributed_jobs
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: djs_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: djs_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"